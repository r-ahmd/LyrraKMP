name: Build Multiplatform Release (Android APK & iOS IPA)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Android Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyrra-v1.0.3-Android.apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Shared KMP Framework & iOS IPA
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64
          
          mkdir -p build/ios/Payload/Lyrra.app/Frameworks
          cp -R shared/build/bin/iosArm64/releaseFramework/SharedFramework.framework build/ios/Payload/Lyrra.app/Frameworks/
          cp iosApp/iosApp/Info.plist build/ios/Payload/Lyrra.app/
          
          # Compile Swift executable binary for iOS arm64
          xcrun -sdk iphoneos swiftc iosApp/iosApp/main.swift iosApp/iosApp/ContentView.swift \
            -target arm64-apple-ios16.0 \
            -F shared/build/bin/iosArm64/releaseFramework \
            -framework SharedFramework \
            -o build/ios/Payload/Lyrra.app/Lyrra
          
          cd build/ios
          zip -r Lyrra-v1.0.3-iOS.ipa Payload/
          ls -lh Lyrra-v1.0.3-iOS.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyrra-v1.0.3-iOS.ipa
          path: build/ios/Lyrra-v1.0.3-iOS.ipa
          retention-days: 30
